name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: npm test

  deploy:
    needs: test
    # Only deploy from main (pushes to dev and PRs stop after build + test)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(npx vercel deploy dist --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Health check
        run: bash scripts/healthcheck.sh "${{ vars.SITE_URL || steps.deploy.outputs.url }}"
      - name: Upload health log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-log
          path: logs/health.log
